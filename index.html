<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/food-order/favicon.ico" />
    <title>edOK</title>
    <script type="module" crossorigin src="/food-order/assets/main-C8tD1pxj.js"></script>
    <link rel="stylesheet" crossorigin href="/food-order/assets/main-CFBempEW.css">
  </head>

  <body data-page="home">
    <div id="app">
      <header class="header">
        <a class="header__logo" href="/food-order/">
          <img class="header__logo-img" src="/food-order/assets/logo-DYj7MIrW.png" alt="edOK" width="370" height="300" />
        </a>
        <button
          class="header__toggle"
          type="button"
          aria-label="Меню сайта"
          aria-controls="header-navigation"
          aria-expanded="false"
          hidden
        >
          <span class="header__toggle-icon" aria-hidden="true"></span>
        </button>
        <nav class="header__nav" id="header-navigation" aria-label="Основная навигация">
          <a class="header__link header__link--home" href="/food-order/">Главная</a>
          <a class="header__link header__link--menu" href="/food-order/menu/">Меню</a>
          <a class="header__link header__link--discounts" href="/food-order/discounts/">Скидки</a>
          <a
            class="header__link header__link--cart header__cart"
            href="/food-order/cart/"
            aria-label="Корзина"
          >
            <svg class="header__cart-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3h2l2.2 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L20.4 7H6" />
              <circle cx="10" cy="19" r="1.5" />
              <circle cx="17" cy="19" r="1.5" />
            </svg>
            <span class="header__cart-count" aria-hidden="true" hidden></span>
          </a>
        </nav>
      </header>
      <main class="main">
        <section class="home-products" aria-labelledby="home-products-title">
          <h1 class="home-products__title" id="home-products-title">Все блюда</h1>
          <p class="home-products__status" role="status">Загружаем меню…</p>
          <ul class="home-products__grid" aria-live="polite"></ul>
          <nav class="home-products__pagination" aria-label="Страницы меню" hidden></nav>
        </section>
      </main>
      <footer class="footer">
        <a class="footer__logo" href="/food-order/" aria-label="edOK — главная">
          <img
            class="footer__logo-img"
            src="/food-order/assets/logo-DYj7MIrW.png"
            alt="edOK"
            width="370"
            height="300"
          />
        </a>
      
        <address class="footer__contacts">
          <p class="footer__contact">city street 1</p>
          <a class="footer__contact" href="tel:+11111111111">+1 111 111 1111</a>
          <a class="footer__contact" href="mailto:food-order@gmail.com">food-order@gmail.com</a>
        </address>
      </footer>
    </div>

  </body>
</html>
