<section class="cart" aria-labelledby="cart-title">
  <h1 class="cart__title" id="cart-title">Корзина</h1>
  <p class="cart__status" role="status">Загружаем корзину…</p>
  <div class="cart__columns" aria-hidden="true" hidden>
    <span class="cart__column cart__column--quantity">количество</span>
    <span class="cart__column cart__column--price">цена</span>
    <span class="cart__column cart__column--total">стоимость</span>
  </div>
  <ul class="cart__list"></ul>
  <div class="cart__summary" aria-live="polite" hidden>
    <span>Стоимость итого:</span>
    <strong class="cart__total"></strong>
  </div>
</section>
