<header class="header">
  <a class="header__logo" href="{{basePath}}">
    <img class="header__logo-img" src="/src/assets/images/logo.png" alt="edOK" width="370" height="300" />
  </a>
  <button
    class="header__toggle"
    type="button"
    aria-label="Меню сайта"
    aria-controls="header-navigation"
    aria-expanded="false"
    hidden
  >
    <span class="header__toggle-icon" aria-hidden="true"></span>
  </button>
  <nav class="header__nav" id="header-navigation" aria-label="Основная навигация">
    <a class="header__link header__link--home" href="{{basePath}}">Главная</a>
    <a class="header__link header__link--menu" href="{{basePath}}menu/">Меню</a>
    <a class="header__link header__link--discounts" href="{{basePath}}discounts/">Скидки</a>
    <a
      class="header__link header__link--cart header__cart"
      href="{{basePath}}cart/"
      aria-label="Корзина"
    >
      <svg class="header__cart-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 3h2l2.2 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L20.4 7H6" />
        <circle cx="10" cy="19" r="1.5" />
        <circle cx="17" cy="19" r="1.5" />
      </svg>
      <span class="header__cart-count" aria-hidden="true" hidden></span>
    </a>
  </nav>
</header>
